# SPDX-License-Identifier: Apache-2.0
#
# Publishes to npm on tag push (vN.N.N or vN.N.N-prerelease).
#
# Setup (one-time):
#   1. Generate a **Granular Access Token** at npmjs.com → Account → Access Tokens
#      (Classic "Automation" tokens do NOT bypass 2FA on modern npm accounts.)
#      - Scope: package "@ejosterberg/medusa-plugin-opensalestax", Read+write
#      - Expiration: 1 year recommended
#      - Granular tokens scoped to specific packages bypass 2FA by design
#   2. Add it as repo secret NPM_TOKEN at
#      https://github.com/ejosterberg/opensalestax-medusa/settings/secrets/actions

name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx jest
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
