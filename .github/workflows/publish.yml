# SPDX-License-Identifier: Apache-2.0
#
# Publishes the Medusa tax provider plugin to NPM on tag push.
#
# Auth: NPM Trusted Publishing (OIDC). No long-lived NPM_TOKEN secret.
# The publish is cryptographically tied to this exact workflow file in
# this exact repo + environment, and npm verifies via OIDC at publish time.
#
# Setup (one-time, configure on npm AFTER the first manual publish):
#   1. https://www.npmjs.com/package/@ejosterberg/medusa-plugin-opensalestax/access
#      → Trusted Publisher → Add → GitHub Actions
#        Organization or user: ejosterberg
#        Repository:           opensalestax-medusa
#        Workflow filename:    publish.yml
#        Environment name:     npm-publish
#   2. GitHub Environment:
#      https://github.com/ejosterberg/opensalestax-medusa/settings/environments
#      New environment → name: npm-publish (no protection rules required)
#
# See ~/.claude/npm-trusted-publishing-playbook.md for setup walkthrough +
# the npm 11.5 / Node 24 gotcha that requires the version pinned below.

name: Publish

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing + provenance

jobs:
  publish:
    name: publish to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Binds the job to the `npm-publish` GitHub Environment. The OIDC
    # token's `environment` claim must match the saved Trusted Publisher
    # config (both "npm-publish").
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24 LTS ships npm 11.x. Trusted Publishing requires
          # npm >= 11.5; Node 22's npm 10.9.7 silently 404s the publish
          # handshake (provenance signs but auth falls through to no-auth).
          # See playbook §"E404 on every publish — npm version too old".
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest

      # Diagnostic: dump the public claims of the OIDC token GitHub will
      # hand to npm. Compare against the Trusted Publisher config if
      # publish 404s. The token itself is never printed.
      - name: Inspect OIDC claims (debug Trusted Publishing)
        uses: actions/github-script@v7
        with:
          script: |
            const audience = 'npm:registry.npmjs.org';
            const token = await core.getIDToken(audience);
            const payload = token.split('.')[1];
            const claims = JSON.parse(Buffer.from(payload, 'base64url').toString('utf8'));
            const fields = {
              iss: claims.iss,
              aud: claims.aud,
              repository: claims.repository,
              repository_owner: claims.repository_owner,
              workflow_ref: claims.workflow_ref,
              job_workflow_ref: claims.job_workflow_ref,
              ref: claims.ref,
              ref_type: claims.ref_type,
              environment: claims.environment ?? '(none)',
              sub: claims.sub,
            };
            await core.summary
              .addHeading('OIDC claims sent to npm')
              .addRaw('Public claims of the OIDC token npm uses to validate the Trusted Publisher trust policy.\n')
              .addCodeBlock(JSON.stringify(fields, null, 2), 'json')
              .write();
            for (const [k, v] of Object.entries(fields)) {
              core.info(`${k.padEnd(18)}= ${v}`);
            }

      - name: Publish (trusted publishing + provenance)
        run: npm publish --access public --provenance
