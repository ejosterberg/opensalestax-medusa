# SPDX-License-Identifier: Apache-2.0
#
# Publishes to npm on tag push (vN.N.N or vN.N.N-prerelease).
#
# Auth: Trusted Publishing via OIDC — no long-lived NPM_TOKEN secret.
# The publish is cryptographically tied to this exact workflow file in
# this exact repo, and npm verifies via OIDC at publish time.
#
# Setup (one-time, configure on npm AFTER the first manual publish):
#   1. Go to:
#      https://www.npmjs.com/package/@ejosterberg/medusa-plugin-opensalestax/access
#   2. Add a Trusted Publisher:
#        Provider:        GitHub Actions
#        Repository owner: ejosterberg
#        Repository name:  opensalestax-medusa
#        Workflow file:    publish.yml
#        Environment:      (optional — set to "release" for extra hardening)
#   3. That's it. No token to manage, no expiration, no rotation.
#
# Why this is preferred over granular access tokens:
#   - No secret stored in GitHub repo settings (nothing to leak)
#   - Tied to this specific workflow file — a malicious commit rewriting
#     the workflow would break the OIDC handshake
#   - Auto-provenance attestations on the published package (green badge
#     on the npm registry page proves the build came from this repo)

name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC handshake with npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx jest
      # Diagnostic: dump the public claims of the OIDC token GitHub will hand
      # to npm. These are the exact values npm matches against the Trusted
      # Publisher trust policy. If publish 404s, compare what's logged here
      # against what's configured at:
      #   https://www.npmjs.com/package/@ejosterberg/medusa-plugin-opensalestax/access
      # The token itself is never printed — only the decoded claim values.
      - name: Inspect OIDC claims (debug Trusted Publishing)
        uses: actions/github-script@v7
        with:
          script: |
            const audience = 'npm:registry.npmjs.org';
            const token = await core.getIDToken(audience);
            const payload = token.split('.')[1];
            const claims = JSON.parse(Buffer.from(payload, 'base64url').toString('utf8'));
            const fields = {
              iss: claims.iss,
              aud: claims.aud,
              repository: claims.repository,
              repository_owner: claims.repository_owner,
              workflow_ref: claims.workflow_ref,
              job_workflow_ref: claims.job_workflow_ref,
              ref: claims.ref,
              ref_type: claims.ref_type,
              environment: claims.environment ?? '(none)',
              sub: claims.sub,
            };
            await core.summary
              .addHeading('OIDC claims sent to npm')
              .addRaw('These are the public claims of the OIDC token npm uses to validate the Trusted Publisher trust policy. Compare each value against the Trusted Publisher configuration on the package access page.\n')
              .addCodeBlock(JSON.stringify(fields, null, 2), 'json')
              .write();
            for (const [k, v] of Object.entries(fields)) {
              core.info(`${k.padEnd(18)}= ${v}`);
            }
      - name: Publish to npm (Trusted Publishing)
        run: npm publish --access public --provenance
